[project]
name = "moviedb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "strawberry-graphql[fastapi]>=0.320.1",
    "strawberry-sqlalchemy-mapper>=0.8.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv-build>=0.6.0,<0.7.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]