[project]
name = "moviedb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi-pagination>=0.15.16",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0",
    "strawberry-graphql[fastapi]>=0.320.1",
    "strawberry-sqlalchemy-mapper>=0.8.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv-build>=0.6.0,<0.7.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.fastapi]
entrypoint = "src.moviedb.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.97",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --asyncio-mode=auto --cov=moviedb --cov-report=term --cov-report=term-missing"

# ty does not model Strawberry's Pydantic decorator: it treats the decorated
# classes as variables rather than types in annotations. Scoped to the GraphQL
# adapter package only.
[[tool.ty.overrides]]
include = ["src/moviedb/routes/gql/**"]

[tool.ty.overrides.rules]
invalid-type-form = "ignore"
